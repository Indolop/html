<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crads</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <section class="services-section">
        <div class="container">
            
        </div>
    </section>

    <section></section>



    <section class="product-plans">
        <div class="container">
            <div class="product-header">

                <h2 class="product-heading">Get the right plan for future product.
                </h2>
                
                <div class="period-buttons">
                    <button class="period-btn yearly active">Yearly</button>
                    <button class="period-btn monthly">Monthly</button>
                </div>

            </div>

            <div class="cards-wrapper">

                <div class="card">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">Free</p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

                <div class="card active">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">$29 <span>/month</span></p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

                <div class="card">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">$49 <span>/month</span></p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

            </div>
        </div>
    </section>


</body>

</html>

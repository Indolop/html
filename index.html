<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style/style.css">
</head>
<link rel="stylesheet" href="./style/media.css">

<body>
    <header>
        <div class="container">
            <div class="header-wrapper">
                <div class="logo">
                    <img src="./images/Logo Color.svg" alt="logo">
                </div>
                <nav>
                    <ul class="menu">
                        <li class="meni-item"><a class ="active" href="#">Home</a></li>
                        <li class="meni-item"><a href="#">Features</a></li>
                        <li class="meni-item"><a href="#">Pricing</a></li>
                        <li class="meni-item"><a href="#">Blog</a></li>
                    </ul>
                </nav>
                <div class="header-button">
                    <button>Get Started</button>
                </div>
            </div>
        </div>
    </header>






    <section class="services-section">
        <div class="container">

        </div>
    </section>

    <section></section>



    <section class="product-plans">
        <div class="container">
            <div class="product-header">

                <h2 class="product-heading">Get the right plan for future product.
                </h2>

                <div class="period-buttons">
                    <button class="period-btn yearly active">Yearly</button>
                    <button class="period-btn monthly">Monthly</button>
                </div>

            </div>

            <div class="cards-wrapper">

                <div class="card">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">Free</p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

                <div class="card active">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">$29 <span>/month</span></p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

                <div class="card">
                    <h3 class="card-title">Starter</h3>
                    <p class="card-price">$49 <span>/month</span></p>
                    <p class="card-description">1 Website</p>
                    <p class="card-description">5 GB Hosting</p>
                    <p class="card-description">Limited Support</p>
                    <button class="card-button">Get Started</button>
                </div>

            </div>
        </div>
    </section>
